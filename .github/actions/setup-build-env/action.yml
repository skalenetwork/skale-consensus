name: 'Setup build environment'
description: 'Prepares Ubuntu 24.04 environment, installs toolchain and dependencies, configures SGX wallet sim, and sets up ccache'
inputs:
  cache-prefix:
    description: 'Prefix for ccache cache key'
    required: false
    default: 'skale-consensus'

runs:
  using: 'composite'
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo add-apt-repository -y --no-update ppa:ubuntu-toolchain-r/test
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential software-properties-common apt-utils libproc2-dev \
          gcc-11 g++-11 valgrind gawk sed gperf libffi-dev ccache libunwind-dev \
          libgoogle-perftools-dev yasm texinfo autotools-dev autogen automake \
          autoconf m4 shtool pkg-config nasm unzip gettext python3 python3-pip \
          libtool libgcrypt20-dev

    - name: Docker diagnostics
      shell: bash
      run: |
        docker --version
        docker compose version

    - name: Start SGX simulator
      shell: bash
      run: |
        cd run_sgx_test
        docker compose pull
        docker compose up -d
        container_id=$(docker compose ps -q sgxwallet)
        for attempt in {1..120}; do
          if [[ -z "$container_id" ]] || \
             [[ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != "true" ]]; then
            echo "::error::SGX simulator is not running"
            docker compose logs --no-color --tail=200
            exit 1
          fi
          logs=$(docker compose logs --no-color sgxwallet 2>&1)
          if [[ -s sgx_data/4node.json && -s sgx_data/16node.json ]] && \
             grep -q "Started zmq read loop" <<< "$logs" && \
             grep -Eq "Successfully completed generating test keys|Found test keys" <<< "$logs"; then
            echo "SGX simulator and test keys are ready"
            break
          fi
          if [[ "$attempt" -eq 120 ]]; then
            echo "::error::Timed out waiting for SGX simulator and test keys"
            docker compose logs --no-color --tail=200
            exit 1
          fi
          sleep 5
        done

    - name: Configure GCC 11 alternatives
      shell: bash
      run: |
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 11
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 11
        sudo update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-11 11
        sudo update-alternatives --install /usr/bin/gcov-dump gcov-dump /usr/bin/gcov-dump-11 11
        sudo update-alternatives --install /usr/bin/gcov-tool gcov-tool /usr/bin/gcov-tool-11 11
        gcc --version
        g++ --version

    - name: Prepare ccache timestamp
      id: ccache_cache_timestamp
      shell: bash
      run: |
        echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache" >> "$GITHUB_ENV"
        echo "timestamp=$(date -u +'%Y-%m-%d-%H;%M;%S')" >> "$GITHUB_OUTPUT"

    - name: ccache cache files
      uses: actions/cache@v4.2.0
      with:
        path: .ccache
        key: ${{ inputs.cache-prefix }}-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
        restore-keys: |
          ${{ inputs.cache-prefix }}-ccache-
